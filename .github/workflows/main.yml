name: Actions

on: [push, pull_request]

jobs:
  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v3
        id: lfs-cache
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS Pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Clear GameCI CLI cache
        run: |
          rm -rf /tmp/game-ci-cli-cache
          rm -rf /home/runner/.cache/game-ci
          echo "GameCI cache cleared"

      - uses: actions/cache@v3
        with:
          path: src/MarkerlessGame/Library
          key: Library-${{ hashFiles('src/MarkerlessGame/Assets/**', 'src/MarkerlessGame/Packages/**', 'src/MarkerlessGame/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectPath: src/MarkerlessGame
          unityVersion: 6000.5.2f1

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: src/MarkerlessGame
          targetPlatform: StandaloneWindows64

      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build
     
